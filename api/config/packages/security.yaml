security:
    password_hashers:
        App\Entity\User:
            algorithm: auto
        MailToken:
            algorithm: sha1
        PasswordResetKey:
            algorithm: auto
        EmailVerification:
            algorithm: auto

    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    # https://symfony.com/doc/current/security/user_providers.html#using-a-custom-query-to-load-the-user
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            stateless: true
            # lazy is necessary to make unauthenticated endpoints
            # (such as user create) work without JWT token
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserStatusChecker
            entry_point: jwt
            # Login is OIDC-only: password login (json_login) is intentionally disabled.
            jwt: ~
            refresh_jwt:
                check_path: /token/refresh
            custom_authenticators:
                - App\Security\OAuth\OidcAuthenticator

    access_control:
        - { path: ^/docs, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI
        - { path: ^/?$, roles: PUBLIC_ACCESS } # Without /, the frontend does not know how to login
        - { path: ^/auth/oidc, roles: PUBLIC_ACCESS } # OIDC login (start + callback) only; password reset/activation stay protected
        - { path: ^/content_types, roles: PUBLIC_ACCESS } # Content types is more or less static and the same for all camps
        - { path: ^/invitations/.*/(find|reject), roles: PUBLIC_ACCESS }
        - { path: ^/token/refresh, roles: PUBLIC_ACCESS }
        # NOTE: password login (/authentication_token), self-registration (POST /users)
        # and account activation are intentionally NOT public — login is OIDC-only.
        - { path: .*, roles: [ROLE_USER] } # Protect all other routes must be at the end

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            App\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
            PasswordResetKey:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
            EmailVerification:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
