name: '[reusable only] e2e tests build'

on:
  workflow_call:

jobs:
  e2e-tests-build:
    name: 'Tests: End-to-end (build job)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # build API (using cache; provide image to docker compose)
      - name: Build docker image (API/PHP)
        uses: docker/build-push-action@v7
        with:
          file: api/Dockerfile
          context: './api'
          push: false
          load: true
          target: frankenphp_prod
          builder: ${{ steps.buildx.outputs.name }}
          tags: docker.io/ecamp/ecamp3-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          outputs: type=docker,dest=/tmp/ecamp3-dev-api.tar

      # Through the Actions cache, not an artifact: nothing goes to GitHub
      # artifact storage (Flo's rule 2026-11-16, the account quota is full).
      # Keyed by run, restored (fail-on-cache-miss) by the run job.
      - name: Save images for the run job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/ecamp3-dev-*.tar
          key: e2e-tests-images-${{ github.run_id }}-${{ github.run_attempt }}
