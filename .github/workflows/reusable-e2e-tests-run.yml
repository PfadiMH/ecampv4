name: '[reusable only] e2e tests run'

on:
  workflow_call:
    inputs:
      run-identifier:
        required: false
        type: string
      grep-filter:
        required: false
        type: string
        default: ''
        description: 'Playwright --grep filter, e.g. "@mature". Empty means run all tests.'

jobs:
  e2e-tests-run:
    name: 'Tests: End-to-end'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_CPU_LIMIT: 4
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
          - behavior-tests
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - run: cp .env.ci .env

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore images from the build job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/ecamp3-dev-*.tar
          key: e2e-tests-images-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Load images
        run: |
          docker load --input /tmp/ecamp3-dev-api.tar
          docker image ls -a --digests

      - name: Restore cache volumes (npm, composer)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache
          key: docker-compose-${{ hashFiles('frontend/package-lock.json', 'print/package-lock.json', 'api/composer.lock') }}-${{ matrix.browser }}
          restore-keys: |
            docker-compose-

      - run: |
          jwt_passphrase=${JWT_PASSPHRASE:-$(grep ''^JWT_PASSPHRASE='' .env | cut -f 2 -d ''='')}
          echo "Generating public / private keys for JWT"
          mkdir -p config/jwt
          echo "$jwt_passphrase" | openssl genpkey -out config/jwt/private.pem -pass stdin -aes256 -algorithm rsa -pkeyopt rsa_keygen_bits:4096
          echo "$jwt_passphrase" | openssl pkey -in config/jwt/private.pem -passin stdin -out config/jwt/public.pem -pubout
          setfacl -R -m u:www-data:rX -m u:"$(whoami)":rwX config/jwt
          setfacl -dR -m u:www-data:rX -m u:"$(whoami)":rwX config/jwt
        working-directory: api

      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --wait -d database

      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm api migrate-database

      # start necessary containers (mock-oidc provides the OIDC identity provider
      # for the OIDC-only login flow, see docker-compose.ci.yml)
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d api frontend print browserless database docker-host http-cache http-cache-logs mail pg-admin reverse-proxy mock-oidc

      # pull playwright while container are starting up
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml pull e2e

      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --entrypoint="npm ci" --rm e2e

      - run: sh -x wait-for-container-startup.sh

      - run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile e2e run
          -e CI=true
          -e PLAYWRIGHT_BLOB_OUTPUT_NAME=report-${{ matrix.browser }}${{ inputs.run-identifier != '' && format('-{0}', inputs.run-identifier) || '' }}.zip
          --rm e2e npx playwright test --project ${{ matrix.browser }}
          ${{ inputs.grep-filter != '' && format('--grep "{0}"', inputs.grep-filter) || '' }}

      - run: sudo chown -R $USER e2e
        if: always()

      # Nothing is uploaded to GitHub artifact storage (Flo's rule 2026-11-16):
      # the evidence is this job log (Playwright's list reporter output above,
      # the failing test dirs below, the container logs further down).
      - name: Summarize Playwright failures
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          [ -d e2e/test-results ] || { echo "no e2e/test-results dir"; exit 0; }
          echo "Failed tests (test-results dirs):"
          find e2e/test-results -mindepth 1 -maxdepth 1 -type d | sort | sed 's|^e2e/test-results/|  |'
          echo "Screenshots / videos / traces:"
          find e2e/test-results -type f \( -name '*.png' -o -name '*.webm' -o -name 'trace.zip' \) | sort

      # print running containers
      - run: docker ps -a
        if: always()

      # print docker container logs (good for debugging; can be disabled again later on)
      - run: docker compose logs --tail="all"
        if: always()
